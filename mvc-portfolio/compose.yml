services:
  app:
    build: .
    ports:
      - "8092:80"
    volumes:
      - ./app:/var/www/html
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

volumes:
  db_data:
